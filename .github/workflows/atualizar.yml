name: Atualizar painel da APS Norte
on:
  schedule:
    # O GitHub tem iniciado as rodadas agendadas 4 a 7 horas depois do horário pedido (medido de 12 a 15/11/2026).
    - cron: "7 6 * * *"     # pedido para 03h07 em Brasília: costuma sair entre 07h e 10h
    - cron: "7 13 * * *"    # pedido para 10h07: costuma sair entre 14h e 17h (segunda carga do dia)
  workflow_dispatch:
permissions: {}      # cada tarefa declara só o que usa
concurrency:
  group: pages
  cancel-in-progress: false     # uma rodada manual não cancela a publicação em andamento
jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write     # grava a data da atualização e o histórico de consolidação
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r coleta/requirements.txt     # versões fixas: esta tarefa recebe a senha e a lotação
      - name: Buscar a lotação (RH) no repositório privado
        uses: actions/checkout@v4
        with:
          repository: gapapsnorte/painel-aps-norte-rh
          ssh-key: ${{ secrets.RH_CHAVE }}      # chave só de leitura, só daquele repositório
          path: _rh
          persist-credentials: false
      - name: Colocar a lotação no lugar (não fica no repositório público nem no site)
        run: |
          cp _rh/referencia.json coleta/referencia.json
          if [ -f _rh/ivt_apsdf_2024.json ]; then cp _rh/ivt_apsdf_2024.json coleta/; fi     # índice de vulnerabilidade: só na área dos gestores
          rm -rf _rh
      - name: Coletar do InfoSaúde (API pública do Power BI)
        working-directory: coleta
        env:
          APS_PEPPER: ${{ secrets.APS_PEPPER }}    # o CNS do profissional é embaralhado antes de ir para o disco
        run: python coleta.py 2022-01
      - name: Coletar população, cadastros e consultas por região (indicador por mil hab.)
        working-directory: coleta
        run: python razao.py
      - name: Coletar totais mensais por região de saúde (comparação Norte × DF × regiões)
        working-directory: coleta
        run: python regioes.py
      - name: Coletar pessoas atendidas e hiperfrequentadores (contagens por faixa, sem identificar ninguém)
        working-directory: coleta
        run: python usuarios.py
      - name: Montar hierarquia e alertas
        working-directory: coleta
        env:
          APS_PEPPER: ${{ secrets.APS_PEPPER }}
          APS_SENHA: ${{ secrets.APS_SENHA }}      # senha dos gestores: cifra a lista de profissionais
        run: python montar.py
      - name: Validar (não publica se parecer vazio ou se houver nome de servidor na parte aberta)
        working-directory: coleta
        run: python validar.py
      - name: Registrar a data da atualização (impede que o GitHub desative o agendamento após 60 dias sem atividade)
        continue-on-error: true
        run: |
          date -u +%F > ultima_atualizacao.txt
          git config user.name "painel-aps-norte[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add ultima_atualizacao.txt historico_consolidacao.csv   # o histórico mede em quantos dias o InfoSaúde fecha cada mês
          git diff --cached --quiet || (git commit -q -m "Atualização de $(cat ultima_atualizacao.txt)" && git pull -q --rebase origin main && git push) \
            || echo "::warning::Não consegui gravar a data da atualização no repositório (o painel é publicado mesmo assim)."
      - if: ${{ vars.PUBLICAR == 'sim' }}
        uses: actions/configure-pages@v5
      - if: ${{ vars.PUBLICAR == 'sim' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: construir
    if: ${{ vars.PUBLICAR == 'sim' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
